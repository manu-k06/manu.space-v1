      <text x="24" y="256" fill="#fff" font-family="sans-serif" font-size="10">Bone Runner ↗</text>
      <rect x="110" y="240" width="75" height="24" rx="3" fill="#c4b5a4" fill-opacity="0.15" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.3" />
      <text x="120" y="256" fill="#fff" font-family="sans-serif" font-size="10">Cineforge ↗</text>
    </g>

    <!-- Card 05 -->
