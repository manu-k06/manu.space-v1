<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2750" width="1000" height="2750" style="background:#0c0b0a;">
  <!-- Dark Mountain Canvas -->
  <rect width="1000" height="2750" fill="#0c0b0a" />

  <!-- Road Layer (Locked Reference) -->
