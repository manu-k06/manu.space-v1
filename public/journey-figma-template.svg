    <path d="M 500,40 C 520,130 680,190 670,300 C 650,410 320,330 220,440 C 130,540 210,680 460,750 C 710,810 860,830 780,960 C 710,1080 470,1130 320,1250 C 170,1350 130,1430 220,1500 C 300,1580 620,1650 760,1780 C 850,1880 840,1950 760,1980 C 640,2050 510,2120 500,2320" stroke="#3c3834" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
    <path d="M 500,40 C 520,130 680,190 670,300 C 650,410 320,330 220,440 C 130,540 210,680 460,750 C 710,810 860,830 780,960 C 710,1080 470,1130 320,1250 C 170,1350 130,1430 220,1500 C 300,1580 620,1650 760,1780 C 850,1880 840,1950 760,1980 C 640,2050 510,2120 500,2320" stroke="#161514" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 500,40 C 520,130 680,190 670,300 C 650,410 320,330 220,440 C 130,540 210,680 460,750 C 710,810 860,830 780,960 C 710,1080 470,1130 320,1250 C 170,1350 130,1430 220,1500 C 300,1580 620,1650 760,1780 C 850,1880 840,1950 760,1980 C 640,2050 510,2120 500,2320" stroke="#dcd8d4" stroke-width="2.5" stroke-dasharray="12 16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75" />
  </g>

  <!-- Waypoint Checkpoints -->
  <g id="Checkpoints_Locked">
    <g id="WP_01_Base_Camp">
      <circle cx="220" cy="440" r="26" fill="none" stroke="#c4b5a4" stroke-width="2" opacity="0.4" />
      <circle cx="220" cy="440" r="15" fill="#141414" stroke="#c4b5a4" stroke-width="2" />
      <text x="220" y="441" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">01</text>
    </g>
    <g id="WP_02_Launchpad">
      <circle cx="780" cy="960" r="26" fill="none" stroke="#c4b5a4" stroke-width="2" opacity="0.4" />
      <circle cx="780" cy="960" r="15" fill="#141414" stroke="#c4b5a4" stroke-width="2" />
      <text x="780" y="961" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">02</text>
    </g>
    <g id="WP_03_First_Orbit">
      <circle cx="220" cy="1500" r="26" fill="none" stroke="#c4b5a4" stroke-width="2" opacity="0.4" />
      <circle cx="220" cy="1500" r="15" fill="#141414" stroke="#c4b5a4" stroke-width="2" />
      <text x="220" y="1501" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">03</text>
    </g>
    <g id="WP_04_Alpine_Ridge">
      <circle cx="760" cy="1980" r="26" fill="none" stroke="#c4b5a4" stroke-width="2" opacity="0.4" />
      <circle cx="760" cy="1980" r="15" fill="#141414" stroke="#c4b5a4" stroke-width="2" />
      <text x="760" y="1981" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">04</text>
    </g>
