      <rect x="16" y="16" width="80" height="18" rx="3" fill="#c4b5a4" fill-opacity="0.12" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.25" />
      <text x="22" y="29" fill="#c4b5a4" font-family="sans-serif" font-size="9" font-weight="bold">01 • 2024</text>
      <text x="108" y="29" fill="#888888" font-family="sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">FOUNDATIONS &amp; RESILIENCE</text>
      <text x="16" y="64" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">The Detour</text>
      <text x="16" y="92" fill="#aaaaaa" font-family="sans-serif" font-size="11">Chased IIT JEE for a year. The grind built stamina and coding foundations.</text>
      <rect x="16" y="165" width="80" height="22" rx="3" fill="#252220" stroke="#333" stroke-width="1" />
      <text x="26" y="180" fill="#999" font-family="sans-serif" font-size="9">Self-Discipline</text>
      <rect x="104" y="165" width="70" height="22" rx="3" fill="#252220" stroke="#333" stroke-width="1" />
      <text x="114" y="180" fill="#999" font-family="sans-serif" font-size="9">Algorithms</text>
    </g>

    <!-- Card 02 -->
    <g id="Card_02_Touchdown_FISAT" transform="translate(670, 1090)">
      <rect width="320" height="210" rx="6" fill="#181615" stroke="#c4b5a4" stroke-width="1.5" stroke-opacity="0.35" />
      <rect x="16" y="16" width="80" height="18" rx="3" fill="#c4b5a4" fill-opacity="0.12" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.25" />
      <text x="22" y="29" fill="#c4b5a4" font-family="sans-serif" font-size="9" font-weight="bold">02 • 2025</text>
      <text x="108" y="29" fill="#888888" font-family="sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">CS CORE &amp; FUNDAMENTALS</text>
      <text x="16" y="64" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Touchdown at FISAT</text>
      <text x="16" y="92" fill="#aaaaaa" font-family="sans-serif" font-size="11">Started B.Tech CS. Mastered C, discrete math, data structures, and Linux.</text>
      <rect x="16" y="165" width="40" height="22" rx="3" fill="#252220" stroke="#333" stroke-width="1" />
      <text x="32" y="180" fill="#999" font-family="sans-serif" font-size="9">C</text>
      <rect x="64" y="165" width="85" height="22" rx="3" fill="#252220" stroke="#333" stroke-width="1" />
      <text x="74" y="180" fill="#999" font-family="sans-serif" font-size="9">Discrete Math</text>
    </g>

    <!-- Card 03 -->
    <g id="Card_03_First_Orbit" transform="translate(10, 1600)">
      <rect width="320" height="230" rx="6" fill="#181615" stroke="#c4b5a4" stroke-width="1.5" stroke-opacity="0.35" />
      <rect x="16" y="16" width="115" height="18" rx="3" fill="#c4b5a4" fill-opacity="0.12" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.25" />
      <text x="22" y="29" fill="#c4b5a4" font-family="sans-serif" font-size="9" font-weight="bold">03 • EARLY 2026</text>
      <text x="140" y="29" fill="#888888" font-family="sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">HACKFIT 4.0 &amp; HORIZON</text>
      <text x="16" y="64" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">First Orbit: Hackathons</text>
      <text x="16" y="92" fill="#aaaaaa" font-family="sans-serif" font-size="11">Shipped CivicPulse live at Hackfit 4.0. Followed up with PixelForge AI.</text>
      <rect x="16" y="185" width="80" height="24" rx="3" fill="#c4b5a4" fill-opacity="0.15" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.3" />
      <text x="26" y="201" fill="#fff" font-family="sans-serif" font-size="10">CivicPulse ↗</text>
      <rect x="104" y="185" width="80" height="24" rx="3" fill="#c4b5a4" fill-opacity="0.15" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.3" />
      <text x="114" y="201" fill="#fff" font-family="sans-serif" font-size="10">PixelForge ↗</text>
