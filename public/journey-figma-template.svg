      <rect width="320" height="290" rx="6" fill="#181615" stroke="#c4b5a4" stroke-width="1.5" stroke-opacity="0.35" />
      <rect x="16" y="16" width="105" height="18" rx="3" fill="#c4b5a4" fill-opacity="0.12" stroke="#c4b5a4" stroke-width="1" stroke-opacity="0.25" />
      <text x="22" y="29" fill="#c4b5a4" font-family="sans-serif" font-size="9" font-weight="bold">04 • MID 2026</text>
      <text x="130" y="29" fill="#888888" font-family="sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">DEEP ENGINEERING</text>
      <text x="16" y="64" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Engines &amp; Full-Stack AI</text>
      <text x="16" y="92" fill="#aaaaaa" font-family="sans-serif" font-size="11">Bone Runner 2D canvas engine, Cineforge Gemini AI, and RAG Chatbot.</text>
